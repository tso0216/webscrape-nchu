[project]
name = "nchu-course-watch"
version = "1.0.0"
description = "監控中興大學通識課餘額，有名額時推播 LINE"
requires-python = ">=3.11"
dependencies = [
    "seleniumbase==4.46.5",
    "python-dotenv",
    "beautifulsoup4",
    "requests",
]

[project.scripts]
nchu = "nchu_course.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
