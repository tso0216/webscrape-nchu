# 日常會調整的設定都在這裡，改完不用動任何 Python 檔。
# 帳號密碼與 LINE token 放在 .env。

[courses]
# 要監控的「選課號碼」。
# 注意：選課號碼每學期重新編號，換學期一定要上選課系統重新確認課號，
#      否則會監控到完全不相干的課。`nchu check` 會提示哪些課號這學期查不到。
watch = [
    "0532","0665","0229","0230","0515"
]

# 查詢的通識領域。EFGKM = 所有通識領域
# E=人文 F=社會 G=自然 K=統合 M=核心素養 L=通識資訊素養 N=外國語文
category = "EFGKM"

# 學年期，例如 "1151"。留空 = 每次自動偵測當學期
year = ""

[poll]
interval = 60           # 一般輪詢間隔（秒）
jitter = 5              # ±秒，避免每次都在同一秒打點
quiet_hours = [1, 7]    # 離峰時段 01:00–07:00（設成 [] 可停用）
quiet_interval = 600    # 離峰時段的間隔（秒）

[retry]
backoff = [60, 120, 300, 900]   # 連續失敗時的退避秒數
alert_after = 3                 # 連續失敗幾次後發 LINE 告警

# ---------------------------------------------------------------------------
# 自動加選：watch 一發現名額，就直接到加選頁把課加下來。
#
# 這是整支程式唯一會「改動選課結果」的功能，所以預設關閉，而且只會加選——
# 任何文字、name、id、onclick 出現「退選 / 退課 / 刪除 / 移除 / 取消…」的元素
# 一律不點；頁面長得跟預期不一樣就中止，不會亂按。
#
# 開啟方式二選一：
#   1. 臨時：nchu watch -e            （先用 nchu watch --dry-run 演練一次更保險）
#   2. 常態：把下面的 auto 改成 true
[enroll]
auto = false

# 要自動加選哪些課號。留空 = 沿用 [courses] watch 的全部課號。
codes = []

max_attempts = 3        # 同一門課連續失敗幾次就不再試（成功會歸零）
retry_after = 0         # 失敗後隔多久才再試（秒）。0 = 下一輪輪詢就再試
verify = true           # 加選後再查一次選課清單確認，結果不用猜關鍵字
keep_debug = false      # true = 每次加選都把頁面存到 data/enroll-debug/

# 加選流程只會 POST 這三個寫死的網址：cof_ssologin（SSO 轉手）、
# enro_direct2_chk（確認頁）、enro_direct3_dml（送出）。退選相關頁面
# （enro_del1_list、enro_rule1_list?v_type=D、enro_stop_list）不在白名單內，
# 程式沒有任何路徑打得到，所以不需要也不能在這裡設定它們。
